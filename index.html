<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Snape's Spelling</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
<style>
  body {
    background: radial-gradient(circle at center, #2a2a2a 0%, #050505 100%);
    color: #d4af37; 
    font-family: 'Cinzel', serif;
    margin: 0; padding: 0; overflow: hidden; touch-action: none;
    height: 100vh;
  }
  .screen {
    display: none; flex-direction: column; align-items: center; 
    justify-content: center; height: 100vh; width: 100vw;
  }
  #gate-screen { display: flex; }
  #gate-title, #dungeon-title { padding: 10px 20px; border-radius: 10px; transition: background 0.2s; cursor: pointer; }
  #gate-title:active, #dungeon-title:active { background: rgba(255,255,255,0.1); }
  
  #game-screen, #parent-screen { position: relative; justify-content: flex-start; padding-top: 20px;}
  
  h1 { font-size: 2.5rem; margin-bottom: 10px; text-shadow: 0 0 15px rgba(212, 175, 55, 0.5); text-align: center; }
  p { color: #ccc; font-family: sans-serif; }
  
  button {
    background: linear-gradient(145deg, #d4af37, #aa8822);
    color: #111; border: 2px solid #fff;
    padding: 15px 30px; font-size: 1.2rem; border-radius: 8px; 
    font-weight: bold; cursor: pointer; font-family: 'Cinzel', serif;
    box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
  }
  button:active { transform: scale(0.95); box-shadow: 0 2px 5px rgba(212, 175, 55, 0.3); }
  button:disabled { background: #444; color: #222; border-color: #333; cursor: not-allowed; box-shadow: none; }
  
  #status { margin-top: 20px; font-style: italic; color: #888; font-family: sans-serif; }
  
  /* Dungeon UI */
  .inventory { font-size: 1.2rem; background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 8px; margin-bottom: 30px; border: 1px solid #d4af37; box-shadow: 0 0 10px rgba(212, 175, 55, 0.2); }
  .potion-grid { display: flex; gap: 25px; flex-wrap: wrap; justify-content: center; max-width: 800px; }
  .potion-card { 
    background: linear-gradient(180deg, #1a1a1a 0%, #0a0a0a 100%);
    border: 2px solid #d4af37; padding: 25px; border-radius: 12px; 
    text-align: center; width: 200px; position: relative;
    box-shadow: 0 10px 20px rgba(0,0,0,0.5);
  }
  .potion-card h2 { margin: 0 0 10px 0; font-size: 1.4rem; }
  
  /* Game UI */
  #game-header { display: flex; justify-content: space-between; width: 90%; margin-bottom: 10px; align-items: center; }
  #target-word-display { font-size: 3rem; letter-spacing: 12px; min-height: 50px; text-shadow: 0 0 10px #d4af37; }
  #play-audio-btn { padding: 10px; font-size: 1rem; }
  #exit-btn { padding: 10px; background: #600; color: #fff; border-color: #a00; }
  #game-area { flex-grow: 1; width: 100%; position: relative; overflow: hidden; border-top: 1px solid #333; background: rgba(0,0,0,0.4); }
  
  /* Guitar Hero Mechanics */
  .falling-letter {
    position: absolute; width: 60px; height: 60px;
    background: linear-gradient(145deg, #2a2a2a, #111); color: #d4af37; 
    font-size: 2rem; font-weight: bold; font-family: sans-serif;
    display: flex; justify-content: center; align-items: center;
    border: 2px solid #d4af37; border-radius: 8px; 
    box-shadow: 0 5px 15px rgba(0,0,0,0.5);
  }

  .hit-effect { animation: shatter 0.3s forwards; pointer-events: none; }
  @keyframes shatter {
    0% { transform: scale(1); opacity: 1; box-shadow: 0 0 20px #0f0; border-color: #0f0; color: #0f0; }
    100% { transform: scale(2.5); opacity: 0; box-shadow: 0 0 50px #0f0; }
  }

  .miss-effect { animation: shake 0.3s; background: #800 !important; border-color: #f00; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-10px) rotate(-5deg); }
    75% { transform: translateX(10px) rotate(5deg); }
  }

  #streak-display {
    position: absolute; top: 20%; left: 50%; transform: translate(-50%, 0);
    font-size: 3rem; color: #0ff; text-shadow: 0 0 20px #00f;
    opacity: 0; pointer-events: none; z-index: 10; font-style: italic;
  }
  .show-streak { animation: floatUp 1s forwards; }
  @keyframes floatUp {
    0% { opacity: 0; transform: translate(-50%, 20px) scale(0.8); }
    20% { opacity: 1; transform: translate(-50%, 0) scale(1.2); }
    80% { opacity: 1; transform: translate(-50%, 0) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -30px); }
  }

  /* Parent Screen */
  .struggle-list { 
    background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px; 
    border: 1px solid #d4af37; width: 80%; max-width: 500px; 
    max-height: 50vh; overflow-y: auto; text-align: left; font-family: sans-serif;
  }
  .struggle-item { display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding: 10px 0; }
  .danger { color: #f55; }
</style>
</head>
<body>

<!-- GATE SCREEN -->
<div id="gate-screen" class="screen">
  <div id="gate-title"><h1>The Marauder's Gate</h1></div>
  <p>State the password to enter.</p>
  <button id="wand-btn">🪄 Tap to Speak</button>
  <div id="status">Waiting...</div>
</div>

<!-- DUNGEON SCREEN -->
<div id="dungeon-screen" class="screen">
  <div id="dungeon-title"><h1>The Potions Dungeon</h1></div>
  <div class="inventory">Inventory: <span id="newt-count">0</span>x Newt Eyes</div>
  
  <div class="potion-grid">
    <div class="potion-card">
      <h2>Polyjuice Potion</h2>
      <p>Level 1 Words</p>
      <button onclick="startLevel(1)">Brew</button>
    </div>
    
    <div class="potion-card">
      <h2>Felix Felicis</h2>
      <p>Level 2 Words</p>
      <p id="felix-req" style="font-size: 0.9rem; color: #aaa;">Requires 5 Newt Eyes</p>
      <button id="btn-level-2" onclick="startLevel(2)" disabled>Locked</button>
    </div>
  </div>
</div>

<!-- GAME SCREEN -->
<div id="game-screen" class="screen">
  <div id="game-header">
    <button id="exit-btn" onclick="returnToDungeon()">Leave</button>
    <div id="target-word-display"></div>
    <button id="play-audio-btn">🔊 Hear Word</button>
  </div>
  <p style="margin:0; font-family: 'Cinzel', serif;">Potions Brewed: <span id="word-progress">0</span> / 5</p>
  <div id="streak-display"></div>
  <div id="game-area"></div>
</div>

<!-- PARENT DASHBOARD -->
<div id="parent-screen" class="screen">
  <h1>Professor's Log</h1>
  <p>Words requiring further study:</p>
  
  <div class="struggle-list" id="struggle-list-container">
    <!-- Populated by JS -->
  </div>
  
  <div style="margin-top: 30px; display: flex; gap: 20px;">
    <button onclick="returnToDungeon()" style="background: #444; border-color: #555;">Back to Dungeon</button>
    <button onclick="resetAppProgress()" style="background: #600; border-color: #a00; color: white;">Erase All Progress</button>
  </div>
</div>

<script>
  const wordsLevel1 = ["fun", "beautiful", "children", "clothes", "sugar", "whole", "water", "again"];
  const wordsLevel2 = ["accident", "bicycle", "knowledge", "medicine", "exercise", "special", "weight"];
  
  // Data Structure includes 'struggles' tracker
  let progress = JSON.parse(localStorage.getItem('edwardSpellingProgress')) || { newts: 0, struggles: {} };
  
  let currentWordList = [], currentWord = "", currentLetterIndex = 0;
  let wordsCompletedInSession = 0, gameInterval, animationFrameReq, activeLetters = [];
  let currentStreak = 0;
  
  const screens = { 
    gate: document.getElementById('gate-screen'), 
    dungeon: document.getElementById('dungeon-screen'), 
    game: document.getElementById('game-screen'),
    parent: document.getElementById('parent-screen')
  };
  
  const targetDisplay = document.getElementById('target-word-display');
  const gameArea = document.getElementById('game-area');
  const playAudioBtn = document.getElementById('play-audio-btn');
  const newtCountDisplay = document.getElementById('newt-count');
  const btnLevel2 = document.getElementById('btn-level-2');
  const streakDisplay = document.getElementById('streak-display');
  const synth = window.speechSynthesis;
  
  // Ensure voices are loaded (helps iOS Safari)
  let availableVoices = [];
  synth.onvoiceschanged = () => { availableVoices = synth.getVoices(); };
  
  function unlockAudio() { synth.speak(new SpeechSynthesisUtterance('')); }
  
  function speakWord(word) {
    const utterance = new SpeechSynthesisUtterance(word);
    utterance.lang = 'en-GB'; 
    
    // Attempt to make it sound like Snape (Deep, slow, British)
    if (availableVoices.length === 0) availableVoices = synth.getVoices();
    const ukMale = availableVoices.find(v => v.lang === 'en-GB' && (v.name.includes('Daniel') || v.name.includes('Arthur') || v.name.includes('Male')));
    if (ukMale) utterance.voice = ukMale;
    
    utterance.rate = 0.65; // Slow drawl
    utterance.pitch = 0.5; // Deep voice
    synth.speak(utterance);
  }
  
  function updateDungeonUI() {
    newtCountDisplay.innerText = progress.newts;
    if (progress.newts >= 5) {
      btnLevel2.disabled = false; btnLevel2.innerText = "Brew";
      document.getElementById('felix-req').innerText = "Unlocked!";
    } else {
      btnLevel2.disabled = true; btnLevel2.innerText = "Locked";
      document.getElementById('felix-req').innerText = "Requires 5 Newt Eyes";
    }
  }
  
  function saveProgress() { 
    localStorage.setItem('edwardSpellingProgress', JSON.stringify(progress)); 
    updateDungeonUI(); 
  }

  // SECRET BYPASS LOGIC (Gate -> Dungeon)
  let gateTapCount = 0; let gateTapTimer;
  document.getElementById('gate-title').addEventListener('click', () => {
    gateTapCount++; clearTimeout(gateTapTimer);
    if (gateTapCount >= 3) {
      gateTapCount = 0; unlockAudio();
      document.getElementById('status').innerText = "Secret passage opened...";
      setTimeout(() => showScreen('dungeon'), 500);
    } else { gateTapTimer = setTimeout(() => gateTapCount = 0, 1000); }
  });

  // SECRET PARENT DASHBOARD LOGIC (Dungeon -> Parent)
  let parentTapCount = 0; let parentTapTimer;
  document.getElementById('dungeon-title').addEventListener('click', () => {
    parentTapCount++; clearTimeout(parentTapTimer);
    if (parentTapCount >= 5) {
      parentTapCount = 0; openParentDashboard();
    } else { parentTapTimer = setTimeout(() => parentTapCount = 0, 1000); }
  });

  // VOICE RECOGNITION (Phase 1)
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const wandBtn = document.getElementById('wand-btn');
  const statusText = document.getElementById('status');
  
  if (SpeechRecognition) {
    const recognition = new SpeechRecognition();
    recognition.lang = 'en-GB';
    wandBtn.addEventListener('click', () => { unlockAudio(); recognition.start(); statusText.innerHTML = "Listening..."; });
    recognition.onresult = (event) => {
      const speech = event.results[0][0].transcript.toLowerCase();
      if (speech.includes("no good") || speech.includes("swear")) {
        statusText.innerHTML = "Mischief Managed."; setTimeout(() => showScreen('dungeon'), 1000);
      } else { statusText.innerHTML = "Incorrect. Try again."; }
    };
  } else {
    wandBtn.addEventListener('click', () => { unlockAudio(); showScreen('dungeon'); });
    wandBtn.innerHTML = "Skip (Voice not supported)";
  }

  // NAVIGATION & PARENT FUNCTIONS
  function showScreen(screenName) { 
    Object.values(screens).forEach(s => s.style.display = 'none'); 
    screens[screenName].style.display = 'flex'; 
    if (screenName === 'dungeon') updateDungeonUI(); 
  }
  
  function returnToDungeon() { 
    clearInterval(gameInterval); cancelAnimationFrame(animationFrameReq); 
    showScreen('dungeon'); 
  }

  function openParentDashboard() {
    const listContainer = document.getElementById('struggle-list-container');
    listContainer.innerHTML = '';
    
    // Ensure struggles object exists for older saves
    if (!progress.struggles) progress.struggles = {};
    
    const sortedStruggles = Object.entries(progress.struggles).sort((a, b) => b[1] - a[1]);
    
    if (sortedStruggles.length === 0) {
      listContainer.innerHTML = '<p>No recorded mistakes yet. He is doing perfectly!</p>';
    } else {
      sortedStruggles.forEach(([word, mistakes]) => {
        listContainer.innerHTML += `
          <div class="struggle-item">
            <span style="text-transform: uppercase; font-weight: bold; color: #d4af37;">${word}</span>
            <span class="${mistakes > 3 ? 'danger' : ''}">${mistakes} mistakes</span>
          </div>
        `;
      });
    }
    showScreen('parent');
  }

  function resetAppProgress() {
    if (confirm("Are you sure you want to erase Edward's Newt Eyes and mistake history? This cannot be undone.")) {
      progress = { newts: 0, struggles: {} };
      saveProgress();
      openParentDashboard();
    }
  }

  // GAME LOOP
  function startLevel(level) {
    currentWordList = level === 1 ? wordsLevel1 : wordsLevel2;
    wordsCompletedInSession = 0; currentStreak = 0;
    document.getElementById('word-progress').innerText = wordsCompletedInSession;
    showScreen('game'); loadNextWord();
  }

  function loadNextWord() {
    gameArea.innerHTML = ''; activeLetters = []; currentLetterIndex = 0;
    currentWord = currentWordList[Math.floor(Math.random() * currentWordList.length)].toUpperCase();
    updateDisplay();
    setTimeout(() => speakWord(currentWord), 500);
    clearInterval(gameInterval);
    gameInterval = setInterval(spawnLetter, 1000); 
    animationFrameReq = requestAnimationFrame(gameLoop);
  }

  function updateDisplay() {
    let displayHtml = '';
    for (let i = 0; i < currentWord.length; i++) { displayHtml += i < currentLetterIndex ? currentWord[i] : '_'; }
    targetDisplay.innerHTML = displayHtml;
  }

  playAudioBtn.addEventListener('click', () => speakWord(currentWord));

  function spawnLetter() {
    const el = document.createElement('div'); el.className = 'falling-letter';
    const nextCorrectLetter = currentWord[currentLetterIndex];
    const isCorrect = Math.random() > 0.4;
    el.innerText = isCorrect ? nextCorrectLetter : String.fromCharCode(65 + Math.floor(Math.random() * 26));
    el.style.left = Math.random() * (window.innerWidth - 80) + 'px';
    let y = -60; el.style.top = y + 'px';
    gameArea.appendChild(el);
    const letterObj = { el, y, char: el.innerText, active: true };
    activeLetters.push(letterObj);
    el.addEventListener('touchstart', (e) => handleLetterTap(e, letterObj));
    el.addEventListener('mousedown', (e) => handleLetterTap(e, letterObj));
  }

  function triggerStreak() {
    streakDisplay.innerText = `${currentStreak}x COMBO!`;
    streakDisplay.classList.remove('show-streak');
    void streakDisplay.offsetWidth; 
    streakDisplay.classList.add('show-streak');
  }

  function handleLetterTap(e, letterObj) {
    e.preventDefault();
    if (!letterObj.active) return; 

    if (letterObj.char === currentWord[currentLetterIndex]) {
      // Correct Hit
      letterObj.active = false; currentStreak++;
      letterObj.el.classList.add('hit-effect');
      
      if (currentStreak > 1) triggerStreak();

      setTimeout(() => letterObj.el.remove(), 300);
      activeLetters = activeLetters.filter(l => l !== letterObj);
      
      currentLetterIndex++; updateDisplay();
      
      if (currentLetterIndex >= currentWord.length) {
        clearInterval(gameInterval); cancelAnimationFrame(animationFrameReq);
        wordsCompletedInSession++;
        document.getElementById('word-progress').innerText = wordsCompletedInSession;
        
        if (wordsCompletedInSession >= 5) {
          setTimeout(() => {
            alert("Potion Brewed! You earned 1 Newt Eye.");
            progress.newts++; saveProgress(); returnToDungeon();
          }, 600);
        } else { setTimeout(loadNextWord, 1000); }
      }
    } else {
      // Wrong Hit - Track Mistake
      currentStreak = 0;
      letterObj.el.classList.add('miss-effect');
      setTimeout(() => letterObj.el.classList.remove('miss-effect'), 300);
      
      // Save struggle data
      if (!progress.struggles) progress.struggles = {};
      progress.struggles[currentWord] = (progress.struggles[currentWord] || 0) + 1;
      saveProgress();
    }
  }

  function gameLoop() {
    activeLetters.forEach(obj => {
      if (!obj.active) return;
      obj.y += 2.5; 
      obj.el.style.top = obj.y + 'px';
      if (obj.y > gameArea.clientHeight) {
        obj.el.remove(); activeLetters = activeLetters.filter(l => l !== obj);
      }
    });
    if (currentLetterIndex < currentWord.length) { animationFrameReq = requestAnimationFrame(gameLoop); }
  }
</script>
</body>
</html>
